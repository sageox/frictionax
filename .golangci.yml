version: "2"

linters:
  # standard = errcheck, govet, ineffassign, staticcheck (now includes gosimple), unused
  default: standard
  exclusions:
    generated: lax
    presets:
      # Unchecked Close/Flush/Fprint*/os.Remove/os.Setenv: golangci-lint's stock exclusion.
      - std-error-handling
    rules:
      # Test fixtures and httptest handlers write without checking; a failure there
      # surfaces as a failed assertion.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sageox/frictionax
  exclusions:
    generated: lax
